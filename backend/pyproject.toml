[project]
name = "chemical-sourcing-rfq-crm-backend"
version = "0.1.0"
description = "Legal B2B chemical sourcing RFQ CRM backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "beautifulsoup4>=4.12.3",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "python-multipart>=0.0.9",
  "email-validator>=2.2.0",
  "playwright>=1.46.0",
  "weasyprint>=62.0",
  "openpyxl>=3.1.0",
  "twilio>=9.0.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
